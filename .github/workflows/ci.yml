name: SmartStore CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check frontend JavaScript syntax
        run: |
          node --check client/src/js/app.js
          node --check client/src/js/api.js
      - name: Run product validation tests
        working-directory: server
        run: |
          npm install
          npm test
